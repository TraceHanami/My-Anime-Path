<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="my favourite.png">
    <title>MY ANIME LIST</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#0f0a1f;
            min-height:100vh;
            margin:10px;
            border:2px solid #6355f7;
            font-family:Arial, Helvetica, sans-serif;
        }

        h1{
            color:white;
            text-align:center;
            margin:20px;
            padding:20px;
            background:#1b1335;
            border:2px solid #6355f7;
            border-radius:12px;
            letter-spacing:3px;
            box-shadow:0 0 15px rgba(99,85,247,0.4);
        }

        .container{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:20px;
            margin:20px;
        }

        .box{
            position:relative;
            height:500px;
            background:#1b1335;
            border:2px solid #6355f7;
            border-radius:12px;
            overflow:hidden;
            transition:0.3s ease;
            box-shadow:0 0 10px rgba(99,85,247,0.3);
        }

        .box:hover{
            transform:translateY(-8px);
            box-shadow:0 0 25px rgba(99,85,247,0.8);
        }

        .box img{
            width:100%;
            height:100%;
            object-fit:cover;
        }

        .anime-title{
            position:absolute;
            bottom:0;
            left:0;
            width:100%;
            padding:15px;
            background:rgba(0,0,0,0.75);
            color:white;
            text-align:center;
            font-size:22px;
            font-weight:bold;
        }
    </style>
</head>

<body>

    <h1>MY ANIME LIST</h1>

    <div class="container">

        <div class="box">
            <img src="naruto.jpg" alt="Naruto">
            <div class="anime-title">Naruto</div>
        </div>

        <div class="box">
            <img src="one peice.jpg" alt="One Piece">
            <div class="anime-title">One Piece</div>
        </div>

        <div class="box">
            <img src="naruto shippuden.jpg" alt="Naruto Shippuden">
            <div class="anime-title">Naruto Shippuden</div>
        </div>

        <div class="box">
            <div class="anime-title">Attack on Titan</div>
        </div>

    </div>

</body>
</html>
